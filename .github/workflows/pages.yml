name: Publish HouSanMao Game Center
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hou-san-mao-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Bundle anonymous leaderboard signing module
        shell: bash
        run: |
          set -euo pipefail
          lib="$RUNNER_TEMP/orchard-ranking"
          npm install --prefix "$lib" --no-fund --no-audit --ignore-scripts nostr-tools@2.10.4 esbuild@0.25.12
          echo "export {generateSecretKey,finalizeEvent,verifyEvent} from 'nostr-tools/pure';" > "$lib/entry.mjs"
          "$lib/node_modules/.bin/esbuild" "$lib/entry.mjs" --bundle --format=esm --minify --outfile=orchard-survival/rank-sign.mjs
      - name: Prepare Traditional Chinese fonts for browser screenshots
        shell: bash
        run: |
          if [ -z "$(fc-list :lang=zh-tw family)" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fi
      - name: Validate site
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s assets/site.css
          test -s assets/site.js
          test -s assets/games.js
          test -s assets/hero-clubhouse.webp
          test -s assets/wealth-monkey.webp
          test -s assets/poker-monkey.webp
          node --check assets/site.js
          node --check assets/games.js
          mkdir -p "$RUNNER_TEMP/orchard-preview" orchard-survival/previews
          ORCHARD_SCREENSHOTS="$RUNNER_TEMP/orchard-preview" node scripts/verify-site.mjs
          cp "$RUNNER_TEMP/orchard-preview/"orchard-*.jpg orchard-survival/previews/
          node scripts/verify-icons.mjs
          node --test scripts/test-stack-battle.mjs scripts/test-stack-battle-ui.mjs
          node scripts/smoke-stack-battle-gamepad.mjs
      - name: Verify anonymous Orchard leaderboard from an independent connection
        run: node scripts/check-orchard-ranking.mjs
      - name: Check leaderboard network integration (diagnostic only)
        continue-on-error: true
        run: node scripts/check-stack-battle-leaderboard-live.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the public Orchard game in Chrome
        env:
          ORCHARD_SCREENSHOTS: ${{ runner.temp }}
        run: node scripts/smoke-orchard.mjs --published
      - name: Save desktop and mobile Orchard screenshots
        uses: actions/upload-artifact@v4
        with:
          name: orchard-browser-screenshots
          path: ${{ runner.temp }}/orchard-*.jpg
          retention-days: 7
