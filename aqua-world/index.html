<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fffdf5">
  <meta name="description" content="水族世界 Aqua World。照顧你的魚、維護水質、打造自己的水下花園。">
  <title>水族世界 Aqua World｜我的水族館</title>
  <script defer src="./vendor/phaser-3.90.0.min.js"></script>
  <script type="module" crossorigin src="./assets/aquarium-runtime-v100.js"></script>
  <script type="module" src="./assets/aquarium-ui-life.mjs?v=100"></script>
  <link rel="stylesheet" href="./assets/aquarium-depth.css?v=100">
</head>
<body>
  <a class="skip-link" href="#aquarium">跳到水族缸</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="./"><span class="brand-mark" aria-hidden="true">≈</span><span><strong>水族世界</strong><small>AQUA WORLD</small></span></a>
      <div class="top-actions">
        <span class="edition"><i></i> <span id="edition-label">單機試玩</span></span>
        <span class="wallet" aria-label="金幣"><b aria-hidden="true">◉</b> <strong id="coins">5,000</strong></span>
        <button id="cloud-open" type="button" class="back-link" aria-haspopup="dialog">雲端存檔</button>
        <a class="back-link" href="https://yiq1796.github.io/game-center/">↗ <span>遊戲中心</span></a>
      </div>
    </div>
  </header>
  <main>
    <section class="intro" aria-labelledby="page-title">
      <h1 id="page-title">我的水族館</h1>
      <small id="save-state">正在讀取試玩存檔</small>
    </section>
    <nav class="career-bar" aria-label="水族館功能">
      <button type="button" data-career="shop" aria-haspopup="dialog">水族商店</button>
      <button type="button" data-career="missions" aria-haspopup="dialog">養成任務<span id="mission-badge" hidden></span></button>
      <button type="button" data-career="breed" aria-haspopup="dialog">繁殖</button>
      <button type="button" data-career="collection" aria-haspopup="dialog">魚類圖鑑</button>
      <button type="button" data-career="facilities" aria-haspopup="dialog">魚缸設備</button>
      <button type="button" data-career="visitors" aria-haspopup="dialog">展缸與遊客</button>
      <p id="career-track" aria-live="polite">養成任務</p>
    </nav>
    <div class="workbench">
      <section class="display" id="aquarium" aria-labelledby="tank-name">
        <div class="tank-top">
          <div class="tank-header">
            <p id="tank-index" hidden>TANK 01 / 淡水</p>
            <h2 id="tank-name">晨光溪谷</h2>
            <div class="tank-tag" id="tank-count">魚隻 3</div>
          </div>
          <div class="tank-switch">
            <nav id="tank-list" aria-label="切換魚缸"></nav>
            <a class="power tank-tools" href="#tank-tools">照顧與造景 ↓</a>
            <button id="low-power" class="power" type="button" aria-pressed="false">節能模式</button>
          </div>
        </div>
        <div class="stage" id="stage" aria-label="互動魚缸">
          <div id="phaser-stage"></div>
          <span id="feeding-status" role="status" aria-live="polite" hidden></span>
          <div class="stage-message" id="stage-message" hidden>這座魚缸目前沒有魚</div>
          <div class="stage-caption"><span id="stage-help">點選游動中的魚</span></div>
        </div>
        <div class="capacity">
          <div><span>生物負載</span><strong id="load-label">7 / 120 點</strong></div>
          <meter id="load-meter" min="0" max="120" value="7" aria-label="生物負載"></meter>
        </div>
      </section>
      <section class="care" id="tank-tools" aria-label="魚缸照顧面板" tabindex="-1">
        <div class="tabs" role="tablist" aria-label="照顧功能">
          <button id="care-tab" type="button" role="tab" aria-selected="true" aria-controls="care-panel">照顧</button>
          <button id="decor-tab" type="button" role="tab" aria-selected="false" aria-controls="decor-panel" tabindex="-1">造景</button>
        </div>
        <div id="care-panel" class="panel" role="tabpanel" aria-labelledby="care-tab">
          <div id="fish-card"></div>
          <div class="water-care">
            <div class="section-heading"><h3>水質觀測</h3><span id="water-status"></span></div>
            <dl id="water-metrics" class="water-metrics"></dl>
            <p id="water-warning" class="muted"></p>
          </div>
          <div class="tank-actions">
            <div class="actions">
              <button id="feed" type="button" class="primary">餵食全缸</button>
              <button id="water" type="button">換水</button>
            </div>
            <div class="supply"><span>飼料 <strong id="food">24</strong> 份</span><button id="buy" type="button">補充 12 份 · 40 金幣</button></div>
          </div>
        </div>
        <div id="decor-panel" class="panel" role="tabpanel" aria-labelledby="decor-tab" hidden>
          <div>
            <h3>新增造景</h3>
            <p class="muted">選擇物件後點擊魚缸放置，也可將物件拖到想擺的位置。</p>
            <div class="decor-actions" aria-label="可放置物件">
              <button type="button" data-decor="grass" aria-pressed="false">＋ 水草</button>
              <button type="button" data-decor="stone" aria-pressed="false">＋ 溪石</button>
              <button type="button" data-decor="wood" aria-pressed="false">＋ 沉木</button>
            </div>
            <button id="place-center" type="button">放在魚缸中央</button>
          </div>
          <div>
            <label class="muted" for="decor-list">缸內造景</label>
            <select id="decor-list" aria-label="選擇造景"></select>
            <div class="decor-actions" aria-label="微調造景位置">
              <button type="button" data-move="left" aria-label="向左移動">←</button>
              <button type="button" data-move="up" aria-label="向上移動">↑</button>
              <button type="button" data-move="down" aria-label="向下移動">↓</button>
              <button type="button" data-move="right" aria-label="向右移動">→</button>
              <button id="remove-decor" type="button">移除選取物件</button>
            </div>
          </div>
        </div>
        <p class="feedback" id="feedback" role="status" aria-live="polite">從觀察魚缸開始今天的照顧。</p>
        <div id="fish-list" class="fish-list" aria-label="個別魚隻"></div>
      </section>
    </div>
    <footer><span id="build-id">v0.10.0-wide-tanks</span><span id="save-note">試玩進度儲存在目前使用的瀏覽器</span></footer>
  </main>
  <dialog id="career-dialog" aria-labelledby="career-title">
    <div class="career-heading">
      <h2 id="career-title">養成任務</h2>
      <button id="career-close" class="career-button" type="button" autofocus>關閉</button>
    </div>
    <div id="career-content"></div>
    <p id="career-status" role="status" aria-live="polite"></p>
  </dialog>
  <dialog id="cloud-dialog" aria-labelledby="cloud-title">
    <div class="cloud-heading">
      <h2 id="cloud-title">雲端存檔</h2>
      <button id="cloud-close" type="button" aria-label="關閉雲端存檔">關閉</button>
    </div>
    <p class="muted">雲端魚缸和單機試玩分開保存。首次建立雲端帳號時會開一座新水族館。</p>
    <form id="cloud-credentials" class="cloud-fields" hidden>
      <label for="cloud-email">電子郵件</label>
      <input id="cloud-email" type="email" autocomplete="username" required maxlength="254">
      <label for="cloud-password">密碼</label>
      <input id="cloud-password" type="password" autocomplete="current-password" required maxlength="4096">
      <div class="cloud-buttons">
        <button class="primary" type="submit">登入</button>
        <button id="cloud-register" type="button">建立帳號</button>
        <button id="cloud-password-reset" type="button">重設密碼</button>
      </div>
    </form>
    <div id="cloud-verification" class="cloud-buttons" hidden>
      <button id="cloud-confirm" class="primary" type="button">我已驗證，繼續登入</button>
      <button id="cloud-resend" type="button">重寄驗證信</button>
      <button type="button" data-cloud-back>返回登入</button>
    </div>
    <form id="cloud-profile" class="cloud-fields" hidden>
      <label for="cloud-nickname">玩家暱稱（2～30 字）</label>
      <input id="cloud-nickname" autocomplete="nickname" minlength="2" maxlength="60" required>
      <div class="cloud-buttons">
        <button class="primary" type="submit">建立雲端魚缸</button>
        <button type="button" data-cloud-back>返回登入</button>
      </div>
    </form>
    <div id="cloud-active" class="cloud-buttons" hidden>
      <button id="cloud-sync" class="primary" type="button">同步最新進度</button>
      <button id="cloud-signout" type="button">登出並回到試玩</button>
    </div>
    <p id="cloud-status" class="muted" role="status" aria-live="polite"></p>
  </dialog>
</body>
</html>
